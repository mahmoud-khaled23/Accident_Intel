[project]
name = "accident-intel"
version = "0.1.0"
description = "Video accident analysis with vehicle tracking, local or hosted vision, traffic-law retrieval, and evidence-grounded reasoning"
readme = "README.md"
authors = [
    { name = "mahmoud-khaled23", email = "mahmoudkhaled1116@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.5.0",
    "pillow>=10.0.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.39.0", # FileResponse byte-range support for video playback
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.3.0",
    "supervision>=0.22.0",
    "opencv-python>=4.9.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "qwen-vl-utils>=0.0.8",
    "decord>=0.6.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "ddgs>=6.0.0",
    "openai>=1.30.0",
    "huggingface-hub>=0.23.0",
    "aiofiles>=25.1.0",
    "pandas>=3.0.6",
    "lap>=0.5.12",
]

[project.scripts]
accident-intel = "src.accident_intel:main"


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
